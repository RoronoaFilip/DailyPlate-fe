name: Release

run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. 1.3.4 (no "v" prefix, must not exist yet)'
        required: true
        type: string
      draft:
        description: 'Create as a draft so you can test the files before publishing'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a valid tag. Use the form 1.2.3 (or 1.2.3-beta.1)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::The tag $TAG already exists. Choose a new one."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Set \"version\" to ${TAG#v} and commit first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caching needs a lock file; before one is committed the cache is simply skipped.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Checks and tests
        run: |
          npm run check:arch
          npm run check:theme
          npm run check:scripts
          npm run fixtures:check
          npm test

      - name: Build for GitHub Pages
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Zip the built site
        run: |
          cd dist/dailyplate-phone/browser
          zip -r "../../../dailyplate-phone-${{ inputs.tag }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: dailyplate-phone-*.zip
          if-no-files-found: error


  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-zip

      - name: Create the release (and the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Daily Plate Phone ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dailyplate-phone-*.zip

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "### Release $TAG"
            echo "- Draft: $DRAFT"
            echo "- Pre-release: $PRERELEASE"
            if [ "$DRAFT" = "true" ]; then
              echo "- The release is a **draft**: download the zip, test it, then click **Publish release** on the Releases page."
              echo "- Publishing the draft starts the **Deploy to GitHub Pages** workflow, which puts this exact zip live."
            elif [ "$PRERELEASE" = "true" ]; then
              echo "- Pre-release: GitHub Pages was **not** updated. Promote it to a full release to deploy it."
            else
              echo "- GitHub Pages is being updated by the next job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Publish on GitHub Pages
    needs: [build, github-release]
    if: ${{ !inputs.draft && !inputs.prerelease }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      tag: ${{ inputs.tag }}
